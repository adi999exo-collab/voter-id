<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>IP Inspection</title>
    <style>
        body {
            margin: 0;
            padding: 10px;
            background-color: #FFFFFF;
            color: #000000;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            font-weight: 400;
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            box-sizing: border-box;
            position: relative;
            -webkit-user-select: none;
            user-select: none;
        }
        #ip-container {
            position: absolute;
            left: 10px;
            top: 10px;
            bottom: 10px;
            width: 180px;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 6px;
            overflow-y: auto;
            z-index: 100;
            padding-bottom: 50px;
            box-sizing: border-box;
            scrollbar-width: none;
            -ms-overflow-style: none;
            -webkit-user-select: none;
            user-select: none;
        }
        #ip-container::-webkit-scrollbar {
            display: none;
        }
        .ip-item {
            font-size: 8px;
            text-align: left;
            white-space: nowrap;
            cursor: default;
            border-bottom: 1px solid #000000;
            padding-bottom: 1px;
            display: inline-block;
            width: auto;
            -webkit-user-select: none;
            user-select: none;
            pointer-events: none;
        }
        .my-ip {
            color: #FF0000;
        }
        .other-ip {
            color: #000000;
        }
        #back-link {
            position: absolute;
            top: 10px;
            right: 10px;
            color: #000000;
            text-decoration: none;
            font-size: 9.2px;
            z-index: 101;
            display: inline-block;
            border-bottom: 1px solid transparent;
            padding-bottom: 1px;
            outline: none;
            background: transparent;
            -webkit-user-select: none;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            cursor: pointer;
        }
    </style>
</head>
<body oncontextmenu="return false;">
    <a id="back-link" href="#">Back to Home</a>
    <div id="ip-container"></div>

    <script>
        document.getElementById('back-link').href = window.location.origin;

        async function fetchIpInfo() {
            try {
                const response = await fetch('/api/active-sessions');
                const data = await response.json();
                
                const clientIp = data.clientIp || '';
                let activeSessions = data.sessions || [];
                
                activeSessions.sort((a, b) => {
                    if (a === clientIp) return -1;
                    if (b === clientIp) return 1;
                    return 0;
                });

                const container = document.getElementById('ip-container');
                container.innerHTML = '';

                activeSessions.forEach(ip => {
                    const div = document.createElement('div');
                    div.className = 'ip-item';

                    if (ip === clientIp) {
                        div.classList.add('my-ip');
                        div.textContent = 'IP Address ' + ip + ' yours';
                    } else {
                        div.className = 'ip-item other-ip';
                        const maskedIP = ip.substring(0, 3) + '*********';
                        div.textContent = 'IP Address ' + maskedIP;
                    }

                    container.appendChild(div);
                });
            } catch (error) {
                console.error('Failed to load IP information');
            }
        }

        fetchIpInfo();
    </script>
</body>
</html>
