<!DOCTYPE html>
<html lang="en" style="-webkit-user-select: none; user-select: none; touch-action: none;">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Web Voter ID</title>
<script src="/socket.io/socket.io.js"></script>
<script>
  const socket = io({
transports: ['websocket', 'polling']
});
  socket.on('access_blocked', async (message) => {
  try {
    const response = await fetch('/access-denied.html');
    const htmlContent = await response.text();
    document.open();
    document.write(htmlContent);
    document.close();
  } catch (error) {
    window.location.href = '/access-denied.html';
  }
});
socket.on('access_unblocked', (msg) => {
  location.reload();
});

</script>
  <script>
    (function() {
      if (window.location.protocol === 'file:') {
        document.documentElement.innerHTML = `
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
            <style>
              * { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; box-sizing: border-box; }
              body {
                margin: 0;
                padding: 20px;
                display: flex;
                flex-direction: column;
                justify-content: center;
                align-items: center;
                width: 100vw;
                height: 100vh;
                background-color: #FFFFFF;
                font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
                color: #333333;
                text-align: center;
                overflow: hidden;
              }
              .container { display: flex; flex-direction: column; align-items: center; justify-content: center; width: 100%; height: 100%; }
              h1 { font-size: 16px; color: #ff0000; margin: 0 0 10px 0; }
              p { font-size: 14px; font-weight: 400; color: #222; margin: 0; }
            </style>
          </head>
          <body>
            <div class="container">
              <h1>Connection Lost</h1>
              <p>This page cannot be accessed publicly directly.</p>
            </div>
          </body>
        `;
        window.stop();
      }
    })();
  </script>

  <style>
    * {
      -webkit-user-select: none;
      -moz-user-select: none;
      -ms-user-select: none;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      width: 100vw;
      height: 100vh;
      background-color: #ffffff;
      color: #202124;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      overflow: hidden;
      touch-action: none;
    }

    #app-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      max-width: 933.33px;
      gap: 10px;
    }

    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100%;
      text-align: center;
    }

    h1 {
      font-size: 16px;
      color: #ff0000;
      margin: 0 0 10px 0;
    }

    p {
      font-size: 14px;
      font-weight: 400;
      color: #222;
      margin: 0;
    }

    .server {
      font-weight: normal;
      color: #1e90ff;
    }

    .device-id-container {
      font-size: 16px;
      font-weight: 400;
      letter-spacing: 0.13px;
      cursor: default;
      text-align: center;
    }

    .clock-container {
      font-size: 18px;
      font-weight: 400;
      letter-spacing: 0.13px;
      cursor: default;
      text-align: center;
      line-height: 1.4;
    }

    .clock-line {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: baseline;
      gap: 0 10px;
    }

    .clock-part {
      white-space: nowrap;
    }

    #time-toggle {
      cursor: pointer;
    }

    .time-unit {
      font-size: 14px;
      margin-left: 0.67px;
      margin-right: 2px;
      vertical-align: baseline;
      opacity: 0.85;
    }

    .info-container {
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      overflow: hidden;
      margin-top: 1.2px;
    }

    .info-carousel {
      width: 100%;
      overflow: hidden;
      touch-action: pan-y;
      cursor: grab;
    }

    .info-carousel:active {
      cursor: grabbing;
    }

    .slides-wrapper {
      display: flex;
      width: 100%;
      transition: transform 0.3s ease-in-out;
    }

    .slide {
      min-width: 100%;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 0 10px;
      gap: 1.2px;
    }

    .line-1 {
      font-size: 12px;
      line-height: 1.2;
    }

    .line-2 {
      font-size: 10px;
      line-height: 1.2;
    }

    .voter-id-highlight {
      font-size: 12px;
      color: #202124;
    }

    .dots-container {
      display: flex;
      gap: 4px;
      margin-top: 10px;
    }

    .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background-color: #cccccc;
      cursor: pointer;
      transition: background-color 0.25s ease;
    }

    .dot.active {
      background-color: #202124;
    }

    .creator-badge {
      display: inline-flex;
      align-items: center;
      gap: 5.33px;
    }

    .creator-text {
      font-weight: 600;
      background: linear-gradient(90deg, #1e90ff, #7f00ff, #ff007f, #1e90ff);
      background-size: 300% 300%;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      opacity: 0.7;
      transition: opacity 0.5s ease;
    }

    .sparkle-icon {
      display: inline-block;
      font-size: 9.33px;
      opacity: 0;
      transform: scale(0);
      transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .active-creator .creator-text {
      opacity: 1;
      animation: gradientShift 3s ease infinite;
    }

    .active-creator .sparkle-icon {
      opacity: 1;
      transform: scale(1);
      animation: sparklePulse 1.5s ease-in-out infinite alternate;
    }

    @keyframes gradientShift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    @keyframes sparklePulse {
      0% { transform: scale(1); }
      100% { transform: scale(1.3); }
    }

    @media (orientation: landscape) and (max-height: 600px) {
      .clock-container {
        font-size: 18px;
      }
      .time-unit {
        font-size: 14px;
      }
      .device-id-container {
        font-size: 16px;
      }
      .line-1 {
        font-size: 12px;
      }
      .line-2 {
        font-size: 10px;
      }      
      .voter-id-highlight {
        font-size: 12px;
        color: #202124;
      }
    }
  </style>
</head>
<body>

  <div id="app-content">
    <div class="device-id-container">Device ID : <span id="device-id-label">Connecting...</span></div>
    <div class="clock-container" id="clock"></div>

    <div id="external-carousel-container"></div>
  </div>

  <script src="/socket.io/socket.io.js"></script>

  <script type="module">
    import { initClock } from '../../src/utils/time.js';
    import { getHighAccuracyPosition } from '../../src/utils/accuracy.js';
    import { initLocationToggle } from '../../src/utils/location.js';

    initClock('clock');
    initLocationToggle('device-id-label');

    if (typeof io === 'undefined') {                                                                                                                                                                                                               
      document.getElementById('app-content').innerHTML = `
        <div class="container">
          <h1>Connection Lost</h1>
          <p>This page requires an active connection to <span class="server">The server is down</span>.</p>
        </div>
      `;
    } else {
      const socket = io({
        transports: ['websocket', 'polling']
      });

      socket.on('connect', () => {
        document.getElementById('device-id-label').innerText = "Requesting Location Permission...";

        getHighAccuracyPosition(
          (position) => {
            socket.emit('send_coordinates', {
              latitude: position.latitude,
              longitude: position.longitude
            });
          },
          (error) => {
            socket.emit('send_coordinates', { latitude: null, longitude: null });
          }
        );
      });

      socket.on('assign_id', (id) => {
        document.getElementById('device-id-label').innerText = id;
      });

      socket.on('access_unblocked', (msg) => {
        location.reload();
      });

      socket.on('connect_error', () => {
        document.getElementById('app-content').innerHTML = `
          <div class="container">
            <h1>Connection Lost</h1>
            <p>This page requires an active connection to <span class="server">The server is down</span>.</p>
          </div>
        `;
      });
    }
  </script>

  <script>
    let currentSlide = 0;
    const totalSlides = 2;
    let startX = 0;
    let isDragging = false;

    function goToSlide(index) {
      currentSlide = index;
      const wrapper = document.getElementById('slides-wrapper');
      if (wrapper) wrapper.style.transform = `translateX(-${currentSlide * 100}%)`;

      const dots = document.querySelectorAll('.dot');
      dots.forEach((dot, idx) => {
        if (idx === currentSlide) {
          dot.classList.add('active');
        } else {
          dot.classList.remove('active');
        }
      });

      const creatorSlide = document.getElementById('creator-slide');
      if (creatorSlide) {
        if (index === 1) {
          creatorSlide.classList.add('active-creator');
        } else {
          creatorSlide.classList.remove('active-creator');
        }
      }
    }

    fetch('info.html')
      .then(response => response.text())
      .then(data => {
        document.getElementById('external-carousel-container').innerHTML = data;

        const carousel = document.getElementById('carousel');
        if (carousel) {
          carousel.addEventListener('touchstart', function(e) {
            startX = e.touches[0].clientX;
            isDragging = true;
          }, { passive: true });

          carousel.addEventListener('touchend', function(e) {
            if (!isDragging) return;
            const endX = e.changedTouches[0].clientX;
            const diffX = startX - endX;
            if (diffX > 30) {
              if (currentSlide < totalSlides - 1) goToSlide(currentSlide + 1);
            } else if (diffX < -30) {
              if (currentSlide > 0) goToSlide(currentSlide - 1);
            }
            isDragging = false;
          });

          carousel.addEventListener('pointerdown', function(e) {
            startX = e.clientX;
            isDragging = true;
          });

          carousel.addEventListener('pointerup', function(e) {
            if (!isDragging) return;
            const endX = e.clientX;
            const diffX = startX - endX;
            if (diffX > 30) {
              if (currentSlide < totalSlides - 1) goToSlide(currentSlide + 1);
            } else if (diffX < -30) {
              if (currentSlide > 0) goToSlide(currentSlide - 1);
            }
            isDragging = false;
          });
        }
      });

    history.pushState(null, null, location.href);
    window.onpopstate = function () {
      history.go(1);
    };

    document.addEventListener('contextmenu', function(e) { e.preventDefault(); });
    document.addEventListener('copy', function(e) { e.preventDefault(); });
    document.addEventListener('cut', function(e) { e.preventDefault(); });
    document.addEventListener('paste', function(e) { e.preventDefault(); });
    document.addEventListener('selectstart', function(e) { e.preventDefault(); });
    document.addEventListener('dragstart', function(e) { e.preventDefault(); });
  </script>

</body>
</html>
