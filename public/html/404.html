<!DOCTYPE html>
<html lang="id" style="-webkit-user-select: none; user-select: none;">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>404 - Page Not Found</title>
  <style>
    * {
      -webkit-user-select: none;
      -moz-user-select: none;
      -ms-user-select: none;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
    }

    body {
      margin: 0;
      padding: 15px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      min-height: 100dvh;
      box-sizing: border-box;
      background-color: #ffffff;
      color: #202124;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      text-align: center;
      touch-action: manipulation;
    }

    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 15px;
      max-width: 600px;
      width: 100%;
      padding: 0 15px;
      box-sizing: border-box;
    }

    .middle-group {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.2px;
      width: 100%;
    }

    h1 {
      font-size: 16px;
      color: #ff0000;
      margin: 0;
      white-space: nowrap;
    }

    .error-code {
      font-size: 26px;
    }

    p {
      font-size: 14px;
      font-weight: 400;
      color: #333333;
      margin: 0;
      line-height: 1.4;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .url-text {
      font-size: 11px;
      white-space: nowrap;
      overflow-wrap: normal;
      word-break: normal;
      display: inline-block;
      transform: skewX(-15deg);
    }

    .back-link {
      font-size: 14px;
      color: #1e90ff;
      text-decoration: none;
      margin-top: 0;
      outline: none;
      -webkit-tap-highlight-color: transparent;
    }

    .back-link:focus, .back-link:active {
      outline: none;
      box-shadow: none;
    }

    .back-link:hover {
      text-decoration: underline;
    }

    /* Tambahan kode baru untuk menyelaraskan posisi ikon di tengah lurus teks */
    .warning-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 21px;
      height: 20px;
      margin-right: 6px;
      vertical-align: middle;
    }

    .warning-icon svg {
      width: 100%;
      height: 100%;
    }

    @media (max-width: 768px) {
      .url-text {
        white-space: normal;
        word-break: break-all;
        overflow-wrap: break-word;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <h1><span class="error-code">404</span> Not Found</h1>
    <div class="middle-group">
      <p>
        <span class="warning-icon">
          <svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
            <path fill="#ff0000" d="M256 32c14.2 0 27.3 7.5 34.5 19.8l216 368c7.3 12.4 7.3 27.7 .2 40.1S486.3 480 472 480H40c-14.3 0-27.6-7.7-34.7-20.1s-7-27.7 .2-40.1l216-368C228.7 39.5 241.8 32 256 32zm0 64L48 432h416L256 96z"/>
            <path fill="#000000" d="M232 184c0-13.3 10.7-24 24-24s24 10.7 24 24v112c0 13.3-10.7 24-24 24s-24-10.7-24-24V184zM256 384c-13.3 0-24-10.7-24-24s10.7-24 24-24s24 10.7 24 24s-10.7 24-24 24z"/>
          </svg>
        </span>Sorry, the page or link you accessed
      </p>
      <p><span id="error-url" class="url-text"></span></p>
      <p>Was Not Found in the system.</p>
    </div>
    <a href="/" class="back-link">Back to Home</a>
  </div>

  <script>
    const accessedPath = window.location.href;
    const urlElement = document.getElementById('error-url');
    urlElement.textContent = `"${accessedPath}"`;

    document.addEventListener('contextmenu', function(e) { e.preventDefault(); });
    document.addEventListener('copy', function(e) { e.preventDefault(); });
    document.addEventListener('cut', function(e) { e.preventDefault(); });
    document.addEventListener('paste', function(e) { e.preventDefault(); });
    document.addEventListener('selectstart', function(e) { e.preventDefault(); });
    document.addEventListener('dragstart', function(e) { e.preventDefault(); });
    document.addEventListener('gesturestart', function(e) { e.preventDefault(); });
    document.addEventListener('gesturechange', function(e) { e.preventDefault(); });
    document.addEventListener('gestureend', function(e) { e.preventDefault(); });
  </script>

</body>
</html>
