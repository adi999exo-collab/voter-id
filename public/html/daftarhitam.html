<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Daftar Hitam IP</title>
    <style>
        body {
            margin: 0;
            padding: 10px;
            background-color: #FFFFFF;
            color: #000000;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            font-weight: 400;
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            box-sizing: border-box;
            position: relative;
            -webkit-user-select: none;
            user-select: none;
        }
        #ip-container {
            position: absolute;
            left: 10px;
            top: 10px;
            bottom: 10px;
            width: 150px;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 6px;
            overflow-y: auto;
            z-index: 10;
            padding-bottom: 50px;
            box-sizing: border-box;
            scrollbar-width: none;
            -ms-overflow-style: none;
        }
        #ip-container::-webkit-scrollbar {
            display: none;
        }
        .ip-item {
            font-size: 8px;
            text-align: left;
            white-space: nowrap;
            cursor: pointer;
            border-bottom: 1px solid #000000;
            padding-bottom: 1px;
            display: inline-block;
            width: auto;
        }
        .my-ip {
            color: #FF0000;
        }
        .other-ip {
            color: #000000;
        }
        .clicked-ip {
            color: #1e90ff !important;
        }
        #center-image {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 101px;
            height: 101px;
            object-fit: contain;
            pointer-events: none;
            -webkit-user-drag: none;
        }
    </style>
</head>
<body oncontextmenu="return false;">
<img id="center-image" src="/403.png" alt="403">
    <div id="ip-container"></div>

    <script>
        async function fetchBlacklistedIPs() {
            try {
                const response = await fetch('/api/blacklisted-ips');
                const data = await response.json();
                
                let ips = data.ips || [];
                const currentIP = data.clientIp || '';
                
                // Menyortir agar IP perangkat sendiri berada di urutan paling atas
                ips.sort((a, b) => {
                    if (a === currentIP) return -1;
                    if (b === currentIP) return 1;
                    return 0;
                });
                
                const container = document.getElementById('ip-container');
                container.innerHTML = '';

                ips.forEach(ip => {
                    const div = document.createElement('div');
                    div.className = 'ip-item';
                    
                    if (ip === currentIP) {
                        div.classList.add('my-ip');
                        div.textContent = 'IP Address ' + ip + ' yours';
                    } else {
                        div.classList.add('other-ip');
                        div.textContent = 'IP Address ' + ip;
                    }
                    
                    div.onclick = function() {
                        navigator.clipboard.writeText(ip);
                        document.querySelectorAll('.ip-item').forEach(item => {
                            if (item.classList.contains('clicked-ip')) {
                                item.classList.remove('clicked-ip');
                            }
                        });
                        div.classList.add('clicked-ip');
                    };

                    container.appendChild(div);
                });
            } catch (error) {
                console.error('Gagal memuat daftar IP');
            }
        }

        fetchBlacklistedIPs();
    </script>
</body>
</html>
